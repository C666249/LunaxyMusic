name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunaxy-android-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V92.9.13 source overlay
        id: overlay
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY=".github/lunaxy-v92.9.13/runtime-overlay.b64"
          if [[ -f "$OVERLAY" ]]; then
            base64 --decode "$OVERLAY" > /tmp/lunaxy-runtime-overlay.tar.xz
            tar -xJf /tmp/lunaxy-runtime-overlay.tar.xz -C .
            rm -f "$OVERLAY"
            rmdir .github/lunaxy-v92.9.13 2>/dev/null || true
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionName = "92.9.13"' app/build.gradle.kts
          grep -F 'versionCode = 991' app/build.gradle.kts

      - name: Commit synchronized V92.9.13 source
        if: steps.overlay.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync LunaxyMusic V92.9.13 Stable source"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/LunaxyMusic-Stable-92.9.13-debug.apk
          sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaxyMusic-V92.9.13-Stable-debug
          path: |
            app/build/outputs/apk/debug/LunaxyMusic-Stable-92.9.13-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
