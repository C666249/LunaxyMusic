name: Build Lunaxy Cloud APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".cloud-build/**"
      - ".github/workflows/build-cloud-apk.yml"
  push:
    branches: [ "cloud-build-*" ]
    paths:
      - ".cloud-build/**"
      - ".github/workflows/build-cloud-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunaxy-cloud-v92.9.24
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore V92.9.23 Cloud overlay
        shell: bash
        run: |
          cat .cloud-build/overlay.b64.part* | base64 -d > /tmp/lunaxy-cloud-overlay.zip
          unzip -oq /tmp/lunaxy-cloud-overlay.zip -d .
          test -f app/src/main/java/com/xingyu/music/ui/LiquidGlassDrawable.java

      - name: Apply V92.9.24 restrained player pass
        shell: bash
        run: |
          python3 .cloud-build/v9224_transform.py
          test -f app/src/main/java/com/xingyu/music/ui/TransportRippleView.java

      - name: Verify independent Cloud identity and visual boundary
        shell: bash
        run: |
          grep -F 'applicationId = "com.xingyu.music.cloud"' app/build.gradle.kts
          grep -F 'versionName = "92.9.24-cloud2"' app/build.gradle.kts
          grep -F 'versionCode = 1009' app/build.gradle.kts
          grep -F '<string name="app_name">Lunaxy Cloud</string>' app/src/main/res/values/strings.xml
          grep -F 'nowPlayRipple.pulse(nowAccent)' app/src/main/java/com/xingyu/music/MainActivity.java
          test "$(grep -c 'stylePlayerDetailLiquidButton(play, 33, Ui.CYAN, true);' app/src/main/java/com/xingyu/music/MainActivity.java)" -eq 1
          test -f tests/playback-chain-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable Cloud debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/LunaxyMusic-Cloud-92.9.24-debug.apk

      - name: Collect APK and checksum
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/LunaxyMusic-Cloud-92.9.24-debug.apk out/LunaxyMusic-V92.9.24-Cloud.apk
          sha256sum out/LunaxyMusic-V92.9.24-Cloud.apk | tee out/LunaxyMusic-V92.9.24-Cloud.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LunaxyMusic-V92.9.24-Cloud-APK
          path: |
            out/LunaxyMusic-V92.9.24-Cloud.apk
            out/LunaxyMusic-V92.9.24-Cloud.apk.sha256
          if-no-files-found: error
          retention-days: 30
