name: Build V143 APKs from issue #6 ZIP attachments
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  build:
    if: github.event.issue.number == 6 && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        channel: [Beta, Stable, Cloud]
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified V143 base source and shared offline model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,os,json,pathlib
          links=re.findall(r'https://github\.com/user-attachments/files/[0-9]+/[^\s)\]>]+',os.environ.get('COMMENT_BODY',''))
          names=['Lunaxy-V143-source-core.zip','Lunaxy-V143-source-model-01.zip','Lunaxy-V143-source-model-02.zip']
          urls=[]
          for name in names:
              chosen=[u for u in links if u.split('?')[0].endswith('/'+name)]
              if len(chosen)!=1:raise SystemExit('Expected exactly one attachment named '+name)
              urls.append(chosen[0])
          pathlib.Path('attachments.json').write_text(json.dumps(urls))
          PY
          python3 - <<'PY'
          import json,subprocess,pathlib,zipfile,hashlib,os
          names=['Lunaxy-V143-source-core.zip','Lunaxy-V143-source-model-01.zip','Lunaxy-V143-source-model-02.zip']
          sums=['5c9f06a3ce9b15da78fb6f41202717ffe8997ee394c8c61531d49f422b618207',
                'bf34a4127ceea10f0bda7ddc00f0ebce8cc5cf7cecae7b5cff745d309c3e0208',
                'fbd4454a62320606187ceb4176fb66243d2924bf3067958f0dabd7fa17aff210']
          urls=json.loads(pathlib.Path('attachments.json').read_text())
          for name,sha,url in zip(names,sums,urls):
              subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--tlsv1.2',url,'-o',name],check=True)
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual!=sha:raise SystemExit(name+' SHA mismatch')
          model=bytearray()
          for i,name in enumerate(names[1:],1):
              with zipfile.ZipFile(name) as archive:
                  assert archive.namelist()==[f'model{i:02d}.bin']
                  model.extend(archive.read(f'model{i:02d}.bin'))
          if hashlib.sha256(model).hexdigest()!='3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba':
              raise SystemExit('Offline speech model SHA mismatch')
          ch=os.environ['CHANNEL']
          with zipfile.ZipFile(names[0]) as archive:
              source=pathlib.Path('LunaxyMusic-V143-'+ch)
              for info in archive.infolist():
                  n=info.filename
                  if n.startswith('base/'):
                      dest=source/n[5:]
                  elif n.startswith('overlay/'+ch+'/'):
                      dest=source/n[len('overlay/'+ch+'/'):]
                  else:continue
                  if not dest.resolve().is_relative_to(source.resolve()):raise SystemExit('Unsafe path')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(archive.read(info))
          model_path=source/'app/src/main/assets/agent-speech/vosk-model-small-cn-0.22.zip'
          model_path.parent.mkdir(parents=True,exist_ok=True)
          model_path.write_bytes(model)
          assert (source/'settings.gradle.kts').is_file()
          print('Restored',ch,'with verified offline model')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "LunaxyMusic-V143-$CHANNEL"
          python3 tests/V143GlobalWakeComposerRegressionTest.py
          python3 tests/V140WakeContinuityTest.py
          python3 tests/V141GlobalWakeTitleNavigationTest.py
          python3 tests/V142AgentSettingsScrollTest.py
          if [ "$CHANNEL" = Cloud ]; then python3 tests/V143CloudIdentityTest.py; fi
      - name: Compile three independent packages
        shell: bash
        run: |
          set -euo pipefail
          cd "LunaxyMusic-V143-$CHANNEL"
          if [ "$CHANNEL" = Cloud ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Prepare APK and signatures
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LUNAXY_CLOUD_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.LUNAXY_CLOUD_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LUNAXY_CLOUD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$CHANNEL" = Cloud ]; then
            if [ -n "$KEYSTORE_B64" ]; then
              printf '%s' "$KEYSTORE_B64" | base64 --decode > cloud.jks
              test -n "$KEYSTORE_PASS"; test -n "$KEY_PASS"
            else
              echo 'WARNING: ephemeral Cloud signing key. Configure secrets for durable Cloud upgrades.'
              KEYSTORE_PASS="$(openssl rand -hex 20)"
              KEY_PASS="$KEYSTORE_PASS"
              keytool -genkeypair -keystore cloud.jks -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" -alias lunaxy-cloud -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Lunaxy Cloud CI,O=Lunaxy,C=US' -noprompt
            fi
            export KEYSTORE_PASS KEY_PASS
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks cloud.jks --ks-key-alias lunaxy-cloud --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out out/LunaxyMusic-V143-Cloud.apk "LunaxyMusic-V143-Cloud/app/build/outputs/apk/release/app-release-unsigned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify out/LunaxyMusic-V143-Cloud.apk
            rm -f cloud.jks
          else
            cp "LunaxyMusic-V143-$CHANNEL/app/build/outputs/apk/debug/app-debug.apk" "out/LunaxyMusic-V143-$CHANNEL.apk"
          fi
          sha256sum "out/LunaxyMusic-V143-$CHANNEL.apk" > "out/LunaxyMusic-V143-$CHANNEL.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: LunaxyMusic-V143-${{ matrix.channel }}-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
