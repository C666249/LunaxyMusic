name: Build V143 APKs from issue #6 ZIP attachments
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  build:
    if: github.event.issue.number == 6 && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        channel: [Beta, Stable, Cloud]
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and reassemble V143 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,os,pathlib,json
          body=os.environ.get('COMMENT_BODY','')
          links=re.findall(r'https://github\.com/user-attachments/files/[0-9]+/[^\s)\]>]+',body)
          result=[]
          for idx in range(1,9):
              name=f'Lunaxy-V143-source-part{idx:02d}.zip'
              chosen=[x for x in links if x.split('?')[0].endswith('/'+name)]
              if len(chosen)!=1: raise SystemExit(f'Expected one attachment: {name}, got {len(chosen)}')
              result.append(chosen[0])
          pathlib.Path('v143_urls.json').write_text(json.dumps(result))
          PY
          python3 - <<'PY'
          import json,subprocess,zipfile,hashlib,pathlib
          sha=[
          'b6906ff3d3bb937caaeb2375a2a2b9e223a4528c593252b1f0becbc942d3d203',
          'a9e1b4b98ab65c9d91d2adecc527bd2992a1d277b78082f5222ab0fa841ff3a6',
          '92b5bed1e1dcb6bf22d203bb1745486b50a1fe1ea9281cdd8e4c716cb468ebd6',
          '37bf6524df4af3005af9a9beb9016e1e5b2c75acf054ccf4f00124aea6443088',
          '55b294c569c9017b3984c79e432a17421c903bb62a01486f15db75715dba068b',
          '10a8f54fbc6cfbd36094c3f74ce8cbead1dee40c3121abfa88695a99e84bb9d5',
          'aebda2df590e525257e336af59b596749057d5144a47ed079979222cdf1fcef2',
          '7d7cb564c4c34440acab99c37130b361340ba3809f1994e85a8202c98e228920']
          urls=json.loads(pathlib.Path('v143_urls.json').read_text())
          dst=pathlib.Path('v143-source.zip')
          with dst.open('wb') as output:
              for i,url in enumerate(urls,1):
                  name=f'v143-part{i:02d}.zip'
                  subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--tlsv1.2',url,'-o',name],check=True)
                  z=pathlib.Path(name)
                  h=hashlib.sha256(z.read_bytes()).hexdigest()
                  if h!=sha[i-1]:raise SystemExit(f'Part {i} SHA mismatch')
                  with zipfile.ZipFile(z) as archive:
                      if archive.namelist()!=[f'part{i:02d}.bin']:raise SystemExit('Invalid ZIP segment names')
                      output.write(archive.read(f'part{i:02d}.bin'))
                  z.unlink()
          actual=hashlib.sha256(dst.read_bytes()).hexdigest()
          expected='624f782deb57709bf4503b876f20ad4073f80bebd97a4d57bc6bce40c92d5bb8'
          if actual!=expected:raise SystemExit('Source bundle SHA mismatch')
          print('Verified full V143 source bundle SHA256:',actual)
          PY
      - name: Extract exactly selected channel project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,pathlib,stat
          ch=os.environ['CHANNEL']
          member=f'LunaxyMusic-V143-{ch}-Source.zip'
          with zipfile.ZipFile('v143-source.zip') as outer:
              if member not in outer.namelist():raise SystemExit('Channel source missing')
              pathlib.Path('project-source.zip').write_bytes(outer.read(member))
          with zipfile.ZipFile('project-source.zip') as z:
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  if not p.parts or p.parts[0]!=f'LunaxyMusic-V143-{ch}' or p.is_absolute() or '..' in p.parts:raise SystemExit('Unsafe path: '+item.filename)
                  if stat.S_IFMT(item.external_attr>>16)==stat.S_IFLNK:raise SystemExit('No symlinks')
              z.extractall('.')
          p=pathlib.Path(f'LunaxyMusic-V143-{ch}')
          assert (p/'settings.gradle.kts').is_file()
          print('Verified',p)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "LunaxyMusic-V143-$CHANNEL"
          python3 tests/V143GlobalWakeComposerRegressionTest.py
          python3 tests/V140WakeContinuityTest.py
          python3 tests/V141GlobalWakeTitleNavigationTest.py
          python3 tests/V142AgentSettingsScrollTest.py
          if [ "$CHANNEL" = Cloud ]; then python3 tests/V143CloudIdentityTest.py; fi
      - name: Compile three independent packages
        shell: bash
        run: |
          set -euo pipefail
          cd "LunaxyMusic-V143-$CHANNEL"
          if [ "$CHANNEL" = Cloud ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Prepare APK and signatures
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LUNAXY_CLOUD_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.LUNAXY_CLOUD_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LUNAXY_CLOUD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$CHANNEL" = Cloud ]; then
            if [ -n "$KEYSTORE_B64" ]; then
              printf '%s' "$KEYSTORE_B64" | base64 --decode > cloud.jks
              test -n "$KEYSTORE_PASS"; test -n "$KEY_PASS"
            else
              echo 'WARNING: ephemeral Cloud signing key. Configure secrets for durable Cloud upgrades.'
              KEYSTORE_PASS="$(openssl rand -hex 20)"
              KEY_PASS="$KEYSTORE_PASS"
              keytool -genkeypair -keystore cloud.jks -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" -alias lunaxy-cloud -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Lunaxy Cloud CI,O=Lunaxy,C=US' -noprompt
            fi
            export KEYSTORE_PASS KEY_PASS
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks cloud.jks --ks-key-alias lunaxy-cloud --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out out/LunaxyMusic-V143-Cloud.apk "LunaxyMusic-V143-Cloud/app/build/outputs/apk/release/app-release-unsigned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify out/LunaxyMusic-V143-Cloud.apk
            rm -f cloud.jks
          else
            cp "LunaxyMusic-V143-$CHANNEL/app/build/outputs/apk/debug/app-debug.apk" "out/LunaxyMusic-V143-$CHANNEL.apk"
          fi
          sha256sum "out/LunaxyMusic-V143-$CHANNEL.apk" > "out/LunaxyMusic-V143-$CHANNEL.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: LunaxyMusic-V143-${{ matrix.channel }}-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
