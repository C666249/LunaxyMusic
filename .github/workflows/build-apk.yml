name: Build LunaxyMusic APK
on:
  push:
    branches: [ main ]
    paths: [ "app/**", "tests/**", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lunaxy-stable-v92.9.15
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Stable identity
        run: |
          grep -F 'applicationId = "com.xingyu.music"' app/build.gradle.kts
          grep -F 'versionName = "92.9.15"' app/build.gradle.kts
          grep -F 'versionCode = 995' app/build.gradle.kts
      - name: Run launch regressions
        run: |
          python3 tests/V92915StartupContinuityRegressionTest.py
          python3 tests/V92914ArtworkAccentRegressionTest.py
          python3 tests/V92913MotionUnificationRegressionTest.py
          python3 tests/V92910SplashCompileRegressionTest.py
          python3 tests/V9299SharedHeroAndStartupRegressionTest.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Stable debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -f app/build/outputs/apk/debug/LunaxyMusic-Stable-92.9.15-debug.apk
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/LunaxyMusic-Stable-92.9.15-debug.apk out/LunaxyMusic-V92.9.15-Stable.apk
          sha256sum out/LunaxyMusic-V92.9.15-Stable.apk | tee out/LunaxyMusic-V92.9.15-Stable.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LunaxyMusic-V92.9.15-Stable-APK
          path: |
            out/LunaxyMusic-V92.9.15-Stable.apk
            out/LunaxyMusic-V92.9.15-Stable.apk.sha256
          if-no-files-found: error
          retention-days: 30

# v92.9.15 retrigger after theme sync
